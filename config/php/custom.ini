; =============================================================================
; PHP custom configuration for Moodle
; Overrides defaults from moodlehq/moodle-php-apache base image
; =============================================================================

; --- Uploads ------------------------------------------------------------------
upload_max_filesize = 512M
post_max_size       = 512M

; --- Execution ----------------------------------------------------------------
max_execution_time  = 300
max_input_time      = 300
max_input_vars      = 5000

; --- Memory -------------------------------------------------------------------
memory_limit        = 512M

; --- Session ------------------------------------------------------------------
session.gc_maxlifetime = 7200

; --- OpCache (mejora el rendimiento en producción) ----------------------------
opcache.enable            = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq   = 60
opcache.use_cwd           = 1
opcache.validate_timestamps = 1

; --- Timezone -----------------------------------------------------------------
; Descomentar y ajustar según tu zona horaria
; date.timezone = Europe/Madrid
