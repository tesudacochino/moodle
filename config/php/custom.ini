; =============================================================================
; PHP custom configuration for Moodle
; Settings on top of the official php:apache base image, which ships no php.ini
; (so every directive not set here keeps PHP's built-in default).
; =============================================================================

; --- Errors (producción) ------------------------------------------------------
; Sin php.ini, display_errors vale On por defecto: expondría rutas y detalles
; del servidor a los visitantes. Los errores van al log, no a la respuesta.
; No se fija error_log: PHP usa el ErrorLog de Apache (config/apache/moodle.conf),
; que va a stderr y se ve con 'docker compose logs'. (www-data no puede abrir
; /dev/stderr directamente.)
display_errors         = Off
display_startup_errors = Off
log_errors             = On

; --- Uploads ------------------------------------------------------------------
upload_max_filesize = 512M
post_max_size       = 512M

; --- Execution ----------------------------------------------------------------
max_execution_time  = 300
max_input_time      = 300
max_input_vars      = 5000

; --- Memory -------------------------------------------------------------------
memory_limit        = 512M

; --- Session ------------------------------------------------------------------
session.gc_maxlifetime = 7200

; --- OpCache (mejora el rendimiento en producción) ----------------------------
opcache.enable            = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq   = 60
opcache.use_cwd           = 1
opcache.validate_timestamps = 1

; --- Timezone -----------------------------------------------------------------
; Descomentar y ajustar según tu zona horaria
; date.timezone = Europe/Madrid
