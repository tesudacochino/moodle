<VirtualHost *:80>
    ServerName localhost
    # __DOCUMENT_ROOT__ se sustituye en build time (Dockerfile) según si el
    # checkout de Moodle tiene /public (>=5.1) o no (<5.1) — así esta rama
    # no depende de que alguien se acuerde de ajustarlo a mano.
    DocumentRoot __DOCUMENT_ROOT__

    <Directory __DOCUMENT_ROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Router de Moodle (>=5.x): cualquier URL que no sea un fichero ni un
        # directorio real (p. ej. /r.php/algo/otra/cosa) se resuelve en r.php.
        # Va junto con $CFG->routerconfigured = true (scripts/entrypoint.sh).
        # Es el método B de https://docs.moodle.org/en/Configuring_the_Router
        # y no FallbackResource: con mod_php, una ruta inexistente que acaba en
        # .php la intercepta el manejador de PHP (404) antes que el fallback, y
        # el check core_router de administración queda en ERROR.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ r.php [QSA,L]

        # Security headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # Proteger el directorio de datos de Moodle si estuviera dentro del webroot
    <Directory /var/www/moodledata>
        Require all denied
    </Directory>

    # Logs
    # ErrorLog a stderr del contenedor (lo abre el proceso padre como root):
    # así los errores de Apache y de PHP salen por 'docker compose logs'.
    ErrorLog  /dev/stderr
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined

    # Manejo de errores
    ErrorDocument 503 "Moodle está temporalmente en mantenimiento."
</VirtualHost>
