<VirtualHost *:80>
    ServerName localhost
    # Desde Moodle 5.1, el código web-accesible vive en /public — el resto
    # (config.php, admin, lib...) debe quedar fuera del docroot por seguridad.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Security headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # Proteger el directorio de datos de Moodle si estuviera dentro del webroot
    <Directory /var/www/moodledata>
        Require all denied
    </Directory>

    # Logs
    ErrorLog  ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined

    # Manejo de errores
    ErrorDocument 503 "Moodle está temporalmente en mantenimiento."
</VirtualHost>
