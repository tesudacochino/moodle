# =============================================================================
# Nginx — Reverse proxy para Moodle (en el servidor host)
# =============================================================================
# Este archivo va en el servidor host, NO dentro de Docker.
#
# Ubicación típica:
#   /etc/nginx/sites-available/moodle.tudominio.com
#
# Activar con:
#   sudo ln -s /etc/nginx/sites-available/moodle.tudominio.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplaza:
#   moodle.tudominio.com  → tu dominio real
#   /etc/ssl/moodle/      → ruta a tus certificados
#   8080                  → puerto del contenedor Docker (HTTP_PORT en .env)
# =============================================================================

# ─── Redirigir HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name moodle.tudominio.com;

    # Validación de Let's Encrypt si lo usas en el futuro
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS — Reverse proxy hacia el contenedor Docker ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                          # HTTP/2 para mejor rendimiento
    server_name moodle.tudominio.com;

    # ── Certificados SSL (propios) ───────────────────────────────────────────
    ssl_certificate     /etc/ssl/moodle/fullchain.pem;
    ssl_certificate_key /etc/ssl/moodle/privkey.pem;

    # ── Configuración SSL robusta ────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (1 año) — solo activar cuando estés seguro de que HTTPS funciona
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/moodle.access.log;
    error_log  /var/log/nginx/moodle.error.log  warn;

    # ── Límites de subida (debe coincidir con PHP upload_max_filesize) ───────
    client_max_body_size 512M;

    # ── Timeouts (Moodle puede tener operaciones largas en admin) ────────────
    proxy_connect_timeout  60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── Proxy hacia el contenedor Docker ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;       # Puerto HTTP_PORT del .env

        # Headers críticos — Moodle necesita estos para funcionar correctamente
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;    # ← Indica a Moodle que es HTTPS
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Port   443;

        # Buffers — mejora rendimiento con respuestas grandes de Moodle
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        # Websocket support (para futuras extensiones)
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
    }

    # ── Caché de assets estáticos (imágenes, CSS, JS) ────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-Proto https;

        expires            30d;
        add_header         Cache-Control "public, no-transform";
        access_log         off;
    }

    # ── Proteger archivos sensibles ──────────────────────────────────────────
    location ~ /\.git {
        deny all;
    }
}
