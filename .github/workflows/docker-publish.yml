# =============================================================================
# GitHub Actions — Build y publicación en Docker Hub
# =============================================================================
#
# Triggers:
#   • push a 'main' o 'moodle-5.2' (solo si cambian archivos relevantes de la imagen)
#   • schedule semanal → reconstruye contra el HEAD actual de la rama Moodle
#     indicada en MOODLE_VERSION, recogiendo parches (5.2.1, 5.2.2...) solo
#   • workflow_dispatch → ejecución manual desde GitHub UI
#
# NOTA sobre 'schedule': GitHub Actions solo evalúa este trigger si el workflow
# vive en la rama por defecto del repo (main) — por eso este cron SOLO funciona
# porque este archivo está fusionado en main. Si algún día se vuelve a mover
# solo a una rama de versión, el cron dejaría de dispararse silenciosamente
# (ya nos pasó una vez: 0 ejecuciones programadas en 19 días sin avisar).
#
# Secretos requeridos (GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  → usuario de Docker Hub (ej: tesudacochino)
#   DOCKERHUB_TOKEN     → Access Token (NO la contraseña)
#                         Crear en: hub.docker.com → Account Settings → Security
#
# Tags generados automáticamente desde el archivo MOODLE_VERSION:
#   MOODLE_502_STABLE  →  tesudacochino/moodle:MOODLE_502_STABLE
#                         tesudacochino/moodle:5.2
#                         tesudacochino/moodle:latest
#                         tesudacochino/moodle:sha-<commit>
#
# Para actualizar Moodle (dentro de la serie 5.2.x):
#   1. La rama MOODLE_502_STABLE ya incluye los futuros parches (5.2.1, 5.2.2...)
#      — el cron semanal los recoge solo. Para forzarlo ya: workflow_dispatch.
#   2. Para saltar a otra serie (ej: 5.3): editar MOODLE_VERSION (MOODLE_503_STABLE)
#      y git commit + push → CI construye y publica automáticamente
# =============================================================================

name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - moodle-5.2
    paths:
      - 'Dockerfile'
      - 'MOODLE_VERSION'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/docker-publish.yml'
  schedule:
    # Todos los lunes a las 03:00 UTC — recoge parches nuevos de la rama Moodle activa
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forzar rebuild aunque no haya cambios relevantes'
        required: false
        default: 'false'
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Job principal: build multi-arch y push a Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Leer versión desde MOODLE_VERSION ────────────────────────────────
      - name: Read Moodle version
        id: version
        run: |
          VERSION=$(cat MOODLE_VERSION | tr -d '[:space:]')
          echo "raw=${VERSION}" >> "$GITHUB_OUTPUT"

          # Convertir MOODLE_502_STABLE → 5.2
          DIGITS=$(echo "$VERSION" | grep -oP '(?<=MOODLE_)\d+(?=_STABLE)' || echo "")
          if [ -n "$DIGITS" ]; then
            MAJOR=$(echo "$DIGITS" | cut -c1)
            MINOR=$(echo "$DIGITS" | cut -c2- | sed 's/^0*//')
            [ -z "$MINOR" ] && MINOR="0"
            SEMVER="${MAJOR}.${MINOR}"
          else
            SEMVER="$VERSION"
          fi

          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "Moodle version: ${VERSION} → semver: ${SEMVER}"

      # ── 2b. SHA del HEAD actual de la rama upstream ─────────────────────────
      #     Se usa como build-arg para invalidar la caché de Docker en cada
      #     rebuild programado — sin esto, un build cacheado nunca recogería
      #     los parches nuevos que Moodle publique en la rama STABLE.
      - name: Resolve upstream commit SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/moodle/moodle.git "refs/heads/${{ steps.version.outputs.raw }}" | cut -f1)
          echo "sha=${SHA:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD de ${{ steps.version.outputs.raw }}: ${SHA:-unknown}"

      # ── 3. QEMU para builds multi-arquitectura ───────────────────────────────
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      # ── 4. Docker Buildx ─────────────────────────────────────────────────────
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Login en Docker Hub ───────────────────────────────────────────────
      #    NOTA: secrets solo son accesibles dentro de steps (no en env: global)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 6. Generar tags y labels ─────────────────────────────────────────────
      - name: Generate image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/moodle
          tags: |
            type=raw,value=${{ steps.version.outputs.raw }}
            type=raw,value=${{ steps.version.outputs.semver }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Moodle LMS
            org.opencontainers.image.description=Moodle ${{ steps.version.outputs.semver }} - PHP 8.3 + Apache + PostgreSQL + Redis
            org.opencontainers.image.vendor=${{ secrets.DOCKERHUB_USERNAME }}
            moodle.version=${{ steps.version.outputs.raw }}

      # ── 7. Build multi-arch y Push ───────────────────────────────────────────
      #    Una sola build para amd64 + arm64 → crea un manifest multi-plataforma
      - name: Build Docker image, Tag and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MOODLE_VERSION=${{ steps.version.outputs.raw }}
            MOODLE_COMMIT_SHA=${{ steps.upstream.outputs.sha }}
            PHP_VERSION=8.3
          # Caché nativa de GitHub Actions (más simple y fiable que local)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ---------------------------------------------------------------------------
  # Job secundario: sincronizar README como descripción en Docker Hub
  # ---------------------------------------------------------------------------
  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/moodle
          readme-filepath: ./README.md
          short-description: "Moodle LMS con PHP 8.3, Apache, PostgreSQL 17 y Redis - imagen mantenible y actualizable"
